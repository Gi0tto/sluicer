[project]
name = "sluicer"
version = "0.10.0"
description = "Turn a web page into structured data with no model in the loop."
readme = "README.md"
license = "MIT AND CC-BY-SA-3.0 AND Unicode-3.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.10"
authors = [{ name = "Nichita Briculschi" }]
keywords = [
    "scraping",
    "web-scraping",
    "structured-data",
    "json-ld",
    "microdata",
    "opengraph",
    "schema-org",
    "extraction",
    "html",
    "deterministic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
# The floors are measured, and the `floors` CI job installs exactly these and
# runs the suite on them.
#   lxml 5.3 is the first release with a wheel for every supported Python:
#   5.0-5.2 ship none for cp313, and 5.0 none for macOS arm64.
#   click 8.2 is the first whose CliRunner captures stderr separately; on 8.1.8
#   fourteen tests fail.
#   protego parses robots.txt, which every fetch asks first; the HTTP rung
#   itself is the standard library, so fetching a page needs nothing else.
#   tomli reads a sluicer.toml on Python 3.10, which has no tomllib; it is
#   the parser tomllib was made from, MIT and pure Python, installed on 3.10
#   alone. 1.0.3 is the first that raises TOMLDecodeError, the one error the
#   reader catches, for an impossible date: 1.0.2 raises ValueError for
#   `d = 2021-02-30` (measured), and before 1.0.0 an inline table overwritten
#   implicitly raised KeyError.
#   cssselect reads the CSS selectors a person writes into the XPath lxml
#   evaluates: one pure-Python wheel of 21 KB with no dependency of its own,
#   BSD-3-Clause, the translator of parsel and of lxml's own `cssselect`.
#   1.2 is the first with `:is()`, `:where()` and `:has()`, and with types;
#   `:has()` is translated right from 1.5, and refused below it.
#   trafilatura turns a page into markdown, in the base install since 0.10 so
#   that `pip install sluicer` is the whole install line for every command
#   but the browser's. Measured on 2026-09-26 with uv venvs: the base install
#   went from 5 packages and 22 MB to 21 and 69 MB on Python 3.14 (6 and 22 MB
#   to 22 and 69 MB on 3.10), 33 MB of the difference babel's locale data,
#   which courlan requires; `import sluicer` did not change (30-49 ms), since
#   trafilatura is imported when a page is first turned into markdown, which
#   then costs about 0.12-0.3 s once.
dependencies = [
    "lxml>=5.3",
    "click>=8.2",
    "protego>=0.3",
    "tomli>=1.0.3; python_version < '3.11'",
    "cssselect>=1.2",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
# The browser rung drives Playwright's Chromium directly; the browser itself
# is installed once with `playwright install chromium`. 1.48 is the first
# Playwright with route_web_socket, which the guard needs to judge a page's
# websockets.
browser = ["playwright>=1.48"]
# The stealth rung, the one place scrapling is used, opt-in and one page at a
# time. scrapling's base install is only its parser; its browsers are behind
# its own extra. 0.4.6 is the first whose browsers take ``page_setup``, where
# the guard that keeps them off private addresses is installed.
stealth = ["scrapling[fetchers]>=0.4.6"]
# Deprecated since 0.8, kept so that an install line written for 0.7 still
# installs what it meant: every rung. Plain HTTP needs no extra now; ask for
# `browser`, or `stealth`, by name.
fetch = ["sluicer[browser]", "sluicer[stealth]"]
# In the base install since 0.10, and kept so that an install line written for
# 0.9 still installs, and so that `sluicer[markdown]` puts trafilatura back in
# an environment that lost it, whatever installed it.
markdown = ["trafilatura>=2.0"]
# The only reader behind an extra: microformats2 has a reference parser, and an
# environment holding mf2py alone held twelve packages (measured 2026-09-22)
# against a base install of three at the time.
microformats = ["mf2py>=2.0"]
# page_markdown's trafilatura is the base install's. The server fetches over
# plain HTTP with no extra; add `browser` for pages that need one
# (`sluicer[mcp,browser]`).
# Pinned >=2: mcp 2.x renamed FastMCP to MCPServer and removed the old name.
# 2.1 is the first that can build this server on Python 3.10: 2.0.0 and 2.0.1
# refuse the Required[...] keys of its output schemas there (measured on
# 2026-09-23; 3.11 and later build on 2.0.0). The suite fakes the SDK, so the
# floors job had never built it for real.
mcp = ["mcp>=2.1"]
# The HTTP door serves the MCP server's own tools, so it brings that extra.
# starlette and uvicorn arrive with mcp today and are declared anyway: a
# transitive dependency is not a declared one. Both floors are measured, and the
# `floors` CI job installs exactly these.
#   starlette 1.2 is the first whose TestClient speaks httpx2, the client mcp
#   brings. 1.1 wants httpx, which nothing here installs, and on 1.1.0 the 23
#   tests that use it cannot start.
#   uvicorn 0.31.1 is mcp's own floor, so nothing older installs beside it.
api = ["sluicer[mcp]", "starlette>=1.2", "uvicorn>=0.31.1"]
# Every extra but stealth, which fetches the way a site asked not to be, and
# stays one to ask for by name. The browser itself is downloaded afterwards,
# with `sluicer install browser`.
all = ["sluicer[browser,mcp,api,microformats]"]

[project.urls]
Homepage = "https://github.com/Gi0tto/sluicer"
Documentation = "https://gi0tto.github.io/sluicer/"
Source = "https://github.com/Gi0tto/sluicer"
Issues = "https://github.com/Gi0tto/sluicer/issues"
Changelog = "https://github.com/Gi0tto/sluicer/blob/main/CHANGELOG.md"
Discussions = "https://github.com/Gi0tto/sluicer/discussions"
Funding = "https://github.com/sponsors/Gi0tto"

[project.scripts]
sluicer = "sluicer.cli:main"
sluicer-mcp = "sluicer.mcp_server:main"

[build-system]
# 1.27 is the first hatchling that writes PEP 639's License-Expression, which is
# what the SPDX string above is for.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluicer"]

[tool.hatch.build.targets.sdist]
# The sdist carries the source, the tests and what they read, and the documents
# a user reads. The scoreboard's harness is run from a checkout, and the built
# site is output. The lockfile pins the development environment, not what a
# build needs; the workflows are CI's; and the pictures, most of the 2 MB the
# sdist weighed, are shown on PyPI from the repository, since the README names
# them by absolute address.
exclude = ["/site", "/bench", "/uv.lock", "/.github", "/docs/assets"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Runs the suite in a new order every time, so a test that passes only
    # because of the one before it fails. The run prints its seed:
    # `pytest -p randomly --randomly-seed=N` replays that order, and
    # `-p no:randomly` runs the file order.
    "pytest-randomly>=3.15",
    "ruff>=0.16",
    "mypy>=1.11",
    "hypothesis>=6.168.1",
]

# The three sections below are the gates CI enforces: lint, coverage, types.

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Chosen for a small, typed, dependency-light library, not for the largest
# number of rules available.
select = [
    "E",    # pycodestyle errors: the shape of the line
    "W",    # pycodestyle warnings: trailing whitespace, missing final newline
    "F",    # pyflakes: unused imports and names, the defects that are never style
    "I",    # isort: one import order, so a diff never argues about it
    "UP",   # pyupgrade: this package is >=3.10 and should be written like it
    "B",    # flake8-bugbear: mutable defaults, loop-variable capture, real traps
    "SIM",  # flake8-simplify: the shorter spelling of a control flow already here
    "RET",  # flake8-return: an explicit `return None` that says nothing
    "PLR1711",  # pylint: a `return` on the last line of a None function
    "PLR0402",  # pylint: `import x.y as y` where `from x import y` is meant
    "BLE",  # flake8-blind-except: every bare `except Exception` must be argued for
    "PIE",  # flake8-pie: `startswith(a) or startswith(b)` is one call
    "RUF",  # ruff's own: unsorted __all__, unused unpacked variables
]

[tool.pytest.ini_options]
# The suite, and nothing else: a benchmark's cache under bench/ holds other
# projects' checkouts, fundus's among them, with test suites of their own.
testpaths = ["tests"]

[tool.coverage.run]
source = ["sluicer"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# A floor under what the suite measures, meant to rise with it. Uncovered lines
# are left visible rather than excluded -- among them the ladder's unreachable
# `raise`, uncovered because it cannot happen.
fail_under = 97

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# lxml ships no type information. Silenced for lxml alone: a project-wide
# `--ignore-missing-imports` would also hide a typed dependency going missing.
# The optional extras need no entry: they are imported by name through
# `sluicer.extras`, so mypy runs in a base install exactly as a user has it.
module = ["lxml.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# `from sluicer.fetch import RobotsRefused, fetch as fetch_url` stays one line.
combine-as-imports = true
