[project]
name = "sluicer"
version = "0.0.1"
description = "Turn a web page into structured data with no model in the loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nichita Briculschi" }]
keywords = [
    "scraping",
    "web-scraping",
    "structured-data",
    "json-ld",
    "microdata",
    "opengraph",
    "schema-org",
    "extraction",
    "html",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["lxml>=5.0", "click>=8.1"]

[project.optional-dependencies]
# scrapling's base install is only the parser. The fetchers, and with them
# curl_cffi and the browsers, live behind its own extra, so asking for the
# package alone yields a Sluicer that cannot fetch. CI found this by
# installing it for real; the suite could not, because it fakes the library.
#
# protego parses robots.txt, and sluicer.fetch.identity imports it directly.
# It is a transitive of scrapling[fetchers] today, which is not the same as
# being declared: the day scrapling stops depending on it, the robots gate
# stops working in an install that asked for everything it needed. Declared
# here, where the import lives.
fetch = ["scrapling[fetchers]>=0.4", "protego>=0.3"]
markdown = ["trafilatura>=2.0"]
# The only reader behind an extra. Every other vocabulary is read with the
# lxml the base install already carries; microformats2 has a reference parser
# and reimplementing its implied-property, value-class and backcompat rules in
# XPath would be a worse parser pretending to be one. Measured on 2026-09-22, a
# clean environment holding mf2py alone holds twelve packages, against a base
# install of three, and that ratio is the whole argument for this line.
microformats = ["mf2py>=2.0"]
# The server has three tools and two of them need the other extras:
# extract_declared and page_markdown both fetch when handed a URL, and
# page_markdown needs trafilatura for any input at all. Installing
# sluicer[mcp] alone once gave a server where two of three tools could not
# run, which is not a server anyone asked for.
# Pinned >=2: mcp 2.x renamed FastMCP to MCPServer and the v1 name is gone
# from the package, so a range spanning both would need two import paths.
mcp = ["mcp>=2", "sluicer[fetch]", "sluicer[markdown]"]

[project.urls]
Homepage = "https://github.com/Gi0tto/sluicer"
Source = "https://github.com/Gi0tto/sluicer"
Issues = "https://github.com/Gi0tto/sluicer/issues"
Changelog = "https://github.com/Gi0tto/sluicer/blob/main/CHANGELOG.md"

[project.scripts]
sluicer = "sluicer.cli:main"
sluicer-mcp = "sluicer.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluicer"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "mypy>=1.11"]

# Four human review passes were the only thing between a defect and this
# repository, and a wrong type annotation still got through one of them. The
# three sections below are the gates that make the design's "binding"
# constraints something a machine can refuse, rather than something a reader
# has to notice.

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Chosen for what this project actually is -- a small, typed, dependency-light
# library whose whole promise is determinism -- not for the largest number of
# rules available.
select = [
    "E",    # pycodestyle errors: the shape of the line
    "W",    # pycodestyle warnings: trailing whitespace, missing final newline
    "F",    # pyflakes: unused imports and names, the defects that are never style
    "I",    # isort: one import order, so a diff never argues about it
    "UP",   # pyupgrade: this package is >=3.10 and should be written like it
    "B",    # flake8-bugbear: mutable defaults, loop-variable capture, real traps
    "SIM",  # flake8-simplify: the shorter spelling of a control flow already here
    "RET",  # flake8-return: an explicit `return None` that says nothing
    "PLR1711",  # pylint: a `return` on the last line of a None function
    "PLR0402",  # pylint: `import x.y as y` where `from x import y` is meant
    "BLE",  # flake8-blind-except: every bare `except Exception` must be argued for
    "PIE",  # flake8-pie: `startswith(a) or startswith(b)` is one call
    "RUF",  # ruff's own: unsorted __all__, unused unpacked variables
]

[tool.coverage.run]
source = ["sluicer"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Measured, not chosen: the suite covers 97.42% of statements and branches
# today, so the floor is set just under it. It protects what exists rather
# than announcing a target nobody agreed to, and it is meant to be raised as
# the number rises. The uncovered lines are real and are left visible rather
# than excluded -- among them the ladder's unreachable `raise`, which is
# uncovered precisely because it cannot happen.
fail_under = 97

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# lxml ships no type information, and `lxml-stubs` is a separate, partial,
# third-party package this library does not depend on. Named here, so the
# silence covers the one library that needs it: `--ignore-missing-imports`
# across the project would also cover the day a typed dependency stops being
# found, and say nothing.
#
# The optional extras -- scrapling, trafilatura, protego, mcp, mf2py -- need no
# entry at all. Not one of them is imported at module level; they arrive through
# `importlib.import_module` in `sluicer.extras`, so there is no import for
# mypy to fail to resolve, and this gate runs in a virtualenv with none of
# them installed exactly as a user's base install does.
module = ["lxml.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# `from sluicer.fetch import RobotsRefused, fetch as fetch_url` is one import
# of one module and reads as one line. Splitting the aliased name onto a line
# of its own, which is isort's default, says there are two.
combine-as-imports = true
