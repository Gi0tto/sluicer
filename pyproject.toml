[project]
name = "sluicer"
version = "0.0.1"
description = "Turn a web page into structured data with no model in the loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nichita Briculschi" }]
keywords = [
    "scraping",
    "web-scraping",
    "structured-data",
    "json-ld",
    "microdata",
    "opengraph",
    "schema-org",
    "extraction",
    "html",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["lxml>=5.0", "click>=8.1"]

[project.urls]
Homepage = "https://github.com/Gi0tto/sluicer"
Source = "https://github.com/Gi0tto/sluicer"
Issues = "https://github.com/Gi0tto/sluicer/issues"
Changelog = "https://github.com/Gi0tto/sluicer/blob/main/CHANGELOG.md"

[project.scripts]
sluicer = "sluicer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluicer"]

[dependency-groups]
dev = ["pytest>=8.0"]
