[project]
name = "sluicer"
version = "0.0.1"
description = "Turn a web page into structured data with no model in the loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nichita Briculschi" }]
keywords = [
    "scraping",
    "web-scraping",
    "structured-data",
    "json-ld",
    "microdata",
    "opengraph",
    "schema-org",
    "extraction",
    "html",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["lxml>=5.0", "click>=8.1"]

[project.optional-dependencies]
# scrapling's base install is only the parser. The fetchers, and with them
# curl_cffi and the browsers, live behind its own extra, so asking for the
# package alone yields a Sluicer that cannot fetch. CI found this by
# installing it for real; the suite could not, because it fakes the library.
#
# protego parses robots.txt, and sluicer.fetch.identity imports it directly.
# It is a transitive of scrapling[fetchers] today, which is not the same as
# being declared: the day scrapling stops depending on it, the robots gate
# stops working in an install that asked for everything it needed. Declared
# here, where the import lives.
fetch = ["scrapling[fetchers]>=0.4", "protego>=0.3"]
markdown = ["trafilatura>=2.0"]
# The server has three tools and two of them need the other extras:
# extract_declared and page_markdown both fetch when handed a URL, and
# page_markdown needs trafilatura for any input at all. Installing
# sluicer[mcp] alone once gave a server where two of three tools could not
# run, which is not a server anyone asked for.
# Pinned >=2: mcp 2.x renamed FastMCP to MCPServer and the v1 name is gone
# from the package, so a range spanning both would need two import paths.
mcp = ["mcp>=2", "sluicer[fetch]", "sluicer[markdown]"]

[project.urls]
Homepage = "https://github.com/Gi0tto/sluicer"
Source = "https://github.com/Gi0tto/sluicer"
Issues = "https://github.com/Gi0tto/sluicer/issues"
Changelog = "https://github.com/Gi0tto/sluicer/blob/main/CHANGELOG.md"

[project.scripts]
sluicer = "sluicer.cli:main"
sluicer-mcp = "sluicer.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluicer"]

[dependency-groups]
dev = ["pytest>=8.0"]
