[project]
name = "sluicer"
version = "0.2.0"
description = "Turn a web page into structured data with no model in the loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Nichita Briculschi" }]
keywords = [
    "scraping",
    "web-scraping",
    "structured-data",
    "json-ld",
    "microdata",
    "opengraph",
    "schema-org",
    "extraction",
    "html",
    "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
# Both floors are measured, and the `floors` CI job installs exactly these and
# runs the suite on them.
#   lxml 5.3 is the first release with a wheel for every supported Python:
#   5.0-5.2 ship none for cp313, and 5.0 none for macOS arm64.
#   click 8.2 is the first whose CliRunner captures stderr separately; on 8.1.8
#   fourteen tests fail.
dependencies = ["lxml>=5.3", "click>=8.2"]

[project.optional-dependencies]
# scrapling's base install is only the parser; the fetchers (curl_cffi and the
# browsers) are behind its own extra. Only installing it for real shows this:
# the suite fakes the library.
#
# protego parses robots.txt and sluicer.fetch.identity imports it directly, so
# it is declared here rather than trusted to stay a transitive of scrapling.
fetch = ["scrapling[fetchers]>=0.4", "protego>=0.3"]
markdown = ["trafilatura>=2.0"]
# The only reader behind an extra: microformats2 has a reference parser, and an
# environment holding mf2py alone holds twelve packages (measured 2026-09-22)
# against a base install of three.
microformats = ["mf2py>=2.0"]
# The server brings the other two extras: extract_declared and page_markdown
# fetch when handed a URL, and page_markdown needs trafilatura for any input.
# Pinned >=2: mcp 2.x renamed FastMCP to MCPServer and removed the old name.
mcp = ["mcp>=2", "sluicer[fetch]", "sluicer[markdown]"]

[project.urls]
Homepage = "https://github.com/Gi0tto/sluicer"
Documentation = "https://gi0tto.github.io/sluicer/"
Source = "https://github.com/Gi0tto/sluicer"
Issues = "https://github.com/Gi0tto/sluicer/issues"
Changelog = "https://github.com/Gi0tto/sluicer/blob/main/CHANGELOG.md"

[project.scripts]
sluicer = "sluicer.cli:main"
sluicer-mcp = "sluicer.mcp_server:main"

[build-system]
# 1.27 is the first hatchling that writes PEP 639's License-Expression, which is
# what the SPDX string above is for.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluicer"]

[tool.hatch.build.targets.sdist]
# The sdist carries the source, the tests and the documents a user reads. The
# scoreboard's harness is run from a checkout, and the built site is output.
exclude = ["/site", "/bench"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "mypy>=1.11"]

# The three sections below are the gates CI enforces: lint, coverage, types.

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Chosen for a small, typed, dependency-light library, not for the largest
# number of rules available.
select = [
    "E",    # pycodestyle errors: the shape of the line
    "W",    # pycodestyle warnings: trailing whitespace, missing final newline
    "F",    # pyflakes: unused imports and names, the defects that are never style
    "I",    # isort: one import order, so a diff never argues about it
    "UP",   # pyupgrade: this package is >=3.10 and should be written like it
    "B",    # flake8-bugbear: mutable defaults, loop-variable capture, real traps
    "SIM",  # flake8-simplify: the shorter spelling of a control flow already here
    "RET",  # flake8-return: an explicit `return None` that says nothing
    "PLR1711",  # pylint: a `return` on the last line of a None function
    "PLR0402",  # pylint: `import x.y as y` where `from x import y` is meant
    "BLE",  # flake8-blind-except: every bare `except Exception` must be argued for
    "PIE",  # flake8-pie: `startswith(a) or startswith(b)` is one call
    "RUF",  # ruff's own: unsorted __all__, unused unpacked variables
]

[tool.coverage.run]
source = ["sluicer"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# A floor under what the suite measures, meant to rise with it. Uncovered lines
# are left visible rather than excluded -- among them the ladder's unreachable
# `raise`, uncovered because it cannot happen.
fail_under = 97

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# lxml ships no type information. Silenced for lxml alone: a project-wide
# `--ignore-missing-imports` would also hide a typed dependency going missing.
# The optional extras need no entry: they are imported by name through
# `sluicer.extras`, so mypy runs in a base install exactly as a user has it.
module = ["lxml.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# `from sluicer.fetch import RobotsRefused, fetch as fetch_url` stays one line.
combine-as-imports = true
