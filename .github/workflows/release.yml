name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing here writes to the repository. The one elevated permission is the
# OIDC token trusted publishing needs, and only the job that publishes gets it.
permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag and the version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python -c "
          import os, tomllib, pathlib
          declared = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tagged = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert declared == tagged, f'pyproject says {declared}, the tag says {tagged}'
          print('version agrees:', declared)
          "
      - name: The suite must pass before anything is published
        # The same run as the CI's coverage step, extra and floor included: a
        # gate lighter than the CI would publish what the CI would refuse.
        # Without the api extra the HTTP door's tests are skipped.
        run: uv run --python 3.13 --extra api pytest -q --cov
      - run: uv build
      - name: Check the metadata the way PyPI will
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  installs:
    name: The built wheel installs and works on its own
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No checkout: the wheel has to stand on its own, and a source tree in the
      # working directory is what an import would quietly find instead of it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the wheel in a clean environment and use it
        run: |
          uv venv --python 3.13
          uv pip install dist/*.whl
          .venv/bin/python -c "
          import sluicer
          page = '<script type=\"application/ld+json\">{\"@type\":\"Product\",\"name\":\"Pad\"}</script>'
          result = sluicer.extract(page)
          assert result.records and result.records[0].type == 'Product', result
          assert sluicer.__file__.startswith('$PWD/.venv/'), sluicer.__file__
          print('wheel', sluicer.__version__, 'installs, imports and extracts')
          "
          .venv/bin/sluicer --version

  image:
    # Built from the tagged source, like any build of the Dockerfile, on a
    # runner of each architecture: an arm64 image built under emulation is
    # also tested under it, and a Mac runs arm64. Each is tested as a client
    # uses it before anything is pushed, so a tag always proves its image and
    # only the push waits for the owner to turn it on.
    name: The image on ${{ matrix.arch }} answers over MCP and HTTP, then is pushed
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t sluicer:release .
      - name: A client lists its ten tools over stdio
        # A real MCP handshake with the image, as an agent's client starts it:
        # an image that installs but cannot answer tools/list stops here.
        run: python3 packaging/mcp_smoke.py -- docker run -i --rm sluicer:release
      - name: It serves the tools over HTTP, as nobody, with its licences
        run: |
          uid=$(docker run --rm sluicer:release id -u)
          test "$uid" != 0 || { echo "the image runs as root"; exit 1; }
          docker run --rm sluicer:release sh -c 'cd /usr/share/licenses/sluicer &&
            test -s LICENSE && test -s NOTICE && test -s LICENSES/CC-BY-SA-3.0.txt &&
            test -s LICENSES/Unicode-3.0.txt && grep -q "^lxml " THIRD-PARTY.txt'
          docker run -d --name api -p 127.0.0.1:8000:8000 -e SLUICER_API_TOKEN=release \
            sluicer:release sluicer serve --host 0.0.0.0
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          count=$(curl -fsS -H 'Authorization: Bearer release' http://127.0.0.1:8000/v1/tools \
            | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["tools"]))')
          test "$count" = 10 || { echo "the HTTP API lists $count tools"; exit 1; }
          docker rm -f api
      - name: Push it to the GitHub Container Registry
        # Off until the repository variable PUBLISH_TO_GHCR is true, as the
        # PyPI job waits for PUBLISH_TO_PYPI. The workflow's own token pushes,
        # and the image's source label links the package to this repository.
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_GHCR == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}-${{ matrix.arch }}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag sluicer:release "$image"
          docker push "$image"

  image-index:
    # One name for both architectures, so `docker pull` picks the machine's
    # own. imagetools puts the description on the index, where the registry
    # reads it for an image of several architectures.
    name: One name for both architectures, at the version and at latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_GHCR == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=The data a web page declares, with where each value came from. No model, no API key." \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=MIT AND CC-BY-SA-3.0 AND Unicode-3.0" \
            --tag "${image}:${version}" --tag "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"

  publish:
    name: Publish to PyPI
    needs: [build, installs]
    runs-on: ubuntu-latest
    # Off until the PyPI side exists: a trusted publisher for this repository
    # and workflow, registered at pypi.org, and the repository variable
    # PUBLISH_TO_PYPI set to true. Until then a tag builds and checks the
    # distributions and stops here, instead of failing on a missing publisher.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      # Trusted publishing: PyPI verifies this workflow's identity, so no API
      # token is stored anywhere. Configure it once at
      # https://pypi.org/manage/project/sluicer/settings/publishing/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    name: List the server in the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    # Off until the repository variable PUBLISH_TO_MCP_REGISTRY is true, as the
    # publish job waits for PUBLISH_TO_PYPI. The registry lists server.json and
    # proves it owns the package by the mcp-name line in the README PyPI serves,
    # so this runs only after that release is on PyPI.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_MCP_REGISTRY == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against the checksum it was published with:
      # this job holds a token that can publish in the owner's name.
      - name: Install mcp-publisher 1.8.1, its checksum checked
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until PyPI serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl -sSf -o /dev/null "https://pypi.org/pypi/sluicer/${version}/json"; then
              echo "PyPI serves sluicer ${version}"
              exit 0
            fi
            sleep 10
          done
          echo "PyPI still does not serve sluicer ${version} after five minutes" >&2
          exit 1
      - name: Log in with the workflow's own identity, and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
