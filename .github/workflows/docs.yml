name: Docs

on:
  push:
    branches: [main]
    # A release publishes the site. Path filters are not applied to tags.
    tags: ["v*"]
    # The site is built from more than docs/: it links the root's changelog,
    # roadmap, contributing and security files, scripts/docs_demo.py adds
    # the examples' site, scripts/docs_try.py the wheel, built from src/, and
    # the bridge the try page runs, and scripts/docs_llms.py llms.txt and each
    # page's markdown. A change to any of them changes the published site.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "examples/site/**"
      - "examples/brake-pads.html"
      - "scripts/docs_demo.py"
      - "scripts/docs_try.py"
      - "src/**"
      - "pyproject.toml"
      - "js/bridge.py"
      - "js/scripts/build_wheel.py"
      - "scripts/docs_llms.py"
  # CI skips a change to Markdown or docs alone, yet tests read the README and
  # the pages; a pull request that touches only them is checked here.
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "examples/site/**"
      - "examples/brake-pads.html"
      - "scripts/docs_demo.py"
      - "scripts/docs_try.py"
      - "src/**"
      - "pyproject.toml"
      - "js/bridge.py"
      - "js/scripts/build_wheel.py"
      - "scripts/docs_llms.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs rather than one, because they answer different questions. Building
  # is a test: --strict fails on a broken link or a page nothing references, and
  # it has to run on every push whatever the repository's visibility. Deploying
  # is a publication, and GitHub Pages is unavailable on a private repository
  # outside a paid plan -- so gating the build on that would mean a broken doc
  # could land unnoticed while the repository is private, which is exactly when
  # the docs are being written.
  build:
    name: The documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the site
        # Pinned below 2 on both: MkDocs 2.0 is announced as a breaking release
        # and mkdocs-material already warns about it, so an unpinned uvx would
        # change what --strict means on the day it lands, not on a day we chose.
        run: uvx --from 'mkdocs>=1.6,<2' --with 'mkdocs-material>=9.7,<10' mkdocs build --strict
      - name: The site serves llms.txt, and each page's markdown beside it
        run: test -s site/llms.txt && test -s site/index.md && test -s site/reference/mcp.md
      - name: The tests that read the README and the pages pass
        run: >-
          uv run --python 3.13 --extra mcp pytest -q
          tests/test_docs_in_step.py tests/test_reference.py tests/test_package.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: The documentation is published
    needs: build
    # Pages refuses a private repository on the free plan with a 404 that reads
    # like a missing artifact. Skipping is the honest report: nothing is wrong.
    # Only a release, or a hand-started run, publishes: a push to main built
    # the site for 0.6.0's readers with options only main had. The
    # github-pages environment admits main, tags v* and branches docs-*, the
    # last for corrections to a release's pages.
    if: >-
      github.event.repository.visibility == 'public' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Only this job publishes, so only it may.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
