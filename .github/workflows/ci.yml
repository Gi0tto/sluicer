name: CI

on:
  workflow_dispatch:
  schedule:
    # Once a week against whatever the extras resolve to today. A >=2 pin does not
    # stop a 3.0 landing with another rename, and that would otherwise be found by
    # a user rather than by us.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

# A newer run of the same kind replaces an older one; a run of another kind
# does not. With one group for every event, dispatching the full run on main
# cancelled the push's run of the same commit, and the commit showed as failed
# though every check had passed in the full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # With the api extra, which brings every other but microformats: the HTTP
      # door's tests build the real MCP server and call it through starlette's
      # TestClient, and without it they skip. The suite with no extra at all
      # runs in the floors job below, and those tests skip there.
      # In a random order (pytest-randomly, a dev dependency), seeded with
      # the run's id so the order is written in the log: a test that passes
      # only after another fails here, and `pytest -p randomly
      # --randomly-seed=<the run id>` replays the same order on any machine.
      - name: Run the suite
        run: uv run --python ${{ matrix.python }} --extra api pytest -q -p randomly --randomly-seed=${{ github.run_id }}

  systems:
    # Every other job runs on Linux, and people install Sluicer on macOS and
    # Windows too: a path, an encoding or a line ending that holds on one
    # system can break on another. One Python each; the matrix above covers
    # the versions.
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run the suite
        run: uv run --python 3.13 --extra api pytest -q -p randomly --randomly-seed=${{ github.run_id }}

  quality:
    # Separate from the matrix above on purpose: a red cross here names which
    # gate refused the commit, and each step names which of the three it was.
    # Four human review passes were the only thing standing between a defect
    # and this repository, and a wrong type annotation still got past one.
    name: Lint, types and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Lint
        run: uv run --python 3.13 ruff check src tests
      - name: Types
        # Reads its own settings from pyproject: strict, against src, at the
        # 3.10 floor this package declares whatever interpreter is running it.
        # In the base install, before the step below brings the api extra: a
        # module with an import statement for an extra fails here, as it would
        # for a user without it.
        run: uv run --python 3.13 mypy
      - name: Coverage
        # One interpreter, so the floor is measured against the same thing
        # every time. The matrix above is what proves the suite passes on all
        # five versions. With the api extra: without it the HTTP door's tests
        # are skipped while its module is still measured, which gave 96% on
        # 2026-09-23, under the 97% floor in pyproject.
        run: uv run --python 3.13 --extra api pytest -q --cov --cov-report=term-missing

  offline:
    name: The suite opens no socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the suite with the network taken away
        run: |
          cat > /tmp/no_network.py <<'PY'
          """Fail the build if any test tries to reach the network.

          The project's first promise is that a run costs CPU and nothing else,
          and a promise nothing enforces is a wish.

          This blocks connecting, not the socket type itself. Replacing
          socket.socket wholesale looks stricter and is simply wrong: the stdlib
          ssl module does `class SSLSocket(socket)`, so anything importing it
          dies with a TypeError that has nothing to do with the network. Ask
          what a test is forbidden to DO, not what it may name.
          """
          import socket
          import sys


          class Blocked(RuntimeError):
              pass


          def refuse(*args, **kwargs):
              raise Blocked(
                  "a test tried to reach the network; the suite must never do that"
              )


          socket.socket.connect = refuse
          socket.socket.connect_ex = refuse
          socket.create_connection = refuse
          socket.getaddrinfo = refuse

          import pytest

          sys.exit(pytest.main(["-q"]))
          PY
          # With the api extra, so the HTTP door's tests run here too: its
          # client is starlette's TestClient, which must reach the app without
          # a socket, and here that is enforced rather than believed.
          uv run --extra api python /tmp/no_network.py

  properties:
    # Every job above runs tests/properties too, under the default profile:
    # fifteen examples each from a fixed seed, so a push costs seconds and a
    # red build replays. This job is the search: hundreds of examples each on a
    # push, thousands on the weekly run, a fresh seed every time, and the blob
    # that replays a failure printed beside it. The first such run found a
    # dozen bugs the example tests had never met -- tracebacks, and answers
    # growing with the square of the page -- and the second a wrong oracle.
    # Thousands take about half an hour here, too long to wait for on a push.
    #
    # With the microformats extra, so mf2py is searched too; it is the one
    # reader whose parser is not ours.
    name: The properties hold on hundreds, weekly thousands, of drawn pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Run the properties under the search or the fuzz profile
        env:
          HYPOTHESIS_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'fuzz' || 'search' }}
        run: uv run --python 3.13 --extra microformats pytest -q tests/properties

  build:
    name: The package builds and its metadata parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the wheel and the sdist
        run: uv build
      - name: Check the metadata
        run: uvx twine check dist/*

  import-without-extras:
    name: The base install imports, and fetches over plain HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the base package only, then import it
        run: |
          uv venv
          uv pip install .
          # `.venv/bin/python`, not `uv run`, in this job and the two below:
          # `uv run` re-syncs the environment to uv.lock and installs the source
          # tree in its place, so the check would run against the dev
          # environment rather than the install it names -- the trap the
          # floors job documents.
          .venv/bin/python -c "
          import importlib.util, sluicer
          for extra in ('scrapling', 'playwright', 'patchright', 'curl_cffi', 'trafilatura', 'mcp'):
              assert importlib.util.find_spec(extra) is None, extra + ' leaked into the base install'
          print('base install imports cleanly, version', sluicer.__version__)
          "
      # Since 0.8 the base install fetches: the HTTP rung is the standard
      # library, and nothing but protego is installed for it. Asked of a real
      # server with nothing else installed, not believed from the suite.
      - name: The HTTP rung, with nothing but the base install
        run: .venv/bin/python tests/live/http_check.py
      # The month and weekday names are package data the script writes from
      # a pinned CLDR release. The suite holds the file to the script's form
      # without a socket; here, where the network is, the release itself is
      # read again and the committed file must be exactly what it gives.
      - name: The month names are the pinned CLDR release's
        run: .venv/bin/python scripts/cldr_calendar.py --check

  with-extras:
    name: The extras install and the code can actually use them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Each extra by its own name, and the browsers each drives: the
      # browser extra's Chromium through Playwright, and the stealth extra's
      # through patchright, which keeps its own.
      - name: Install every extra, and the browsers
        run: |
          uv venv
          uv pip install '.[browser,stealth,markdown,mcp,api]'
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m patchright install chromium
      # Deprecated, not removed: an install line written for 0.7 must still
      # bring both browser extras. Read from what the resolver would install.
      - name: The fetch extra still installs what it meant
        run: |
          uv pip install --dry-run '.[fetch]' 2>&1 | tee fetch-extra.txt
          grep -qi 'playwright' fetch-extra.txt || { echo "sluicer[fetch] no longer brings playwright"; exit 1; }
          grep -qi 'scrapling' fetch-extra.txt || { echo "sluicer[fetch] no longer brings scrapling"; exit 1; }
      - name: Use each one against the package that was really installed
        run: |
          .venv/bin/python -c "
          # The suite fakes these libraries, and a fake can only confirm the shape
          # you already believe in. This job is the only place that finds out what
          # the published package actually ships. It caught the mcp 2.x rename.
          from sluicer.markdown import to_markdown
          page = '<html><head><meta charset=\"windows-1252\"></head><body><article><h1>Caf\xe9</h1><p>' + ('Real sentences. ' * 30) + '</p></article></body></html>'
          out = to_markdown(page.encode('windows-1252'))
          assert 'Caf\xe9' in out, 'the markdown path lost the accent: ' + out[:80]
          print('markdown: accent survived')

          # protego parses robots.txt and arrives with the base install. The unit
          # tests fake it, and a fake agrees with whatever you wrote it to agree with,
          # so the real semantics are only ever checked here.
          from sluicer.fetch.identity import USER_AGENT, robots_allows
          assert 'Sluicer' in USER_AGENT and 'github.com' in USER_AGENT, USER_AGENT
          refuse = 'User-agent: Sluicer\nDisallow: /private/\n\nUser-agent: *\nAllow: /\n'
          assert robots_allows('https://example.com/private/p', read=lambda u: refuse, cache={}) is False
          assert robots_allows('https://example.com/public', read=lambda u: refuse, cache={}) is True
          assert robots_allows('https://example.com/p', read=lambda u: None, cache={}) is True
          # A group is matched against the product token, not found in the URL after it.
          other = 'User-agent: https\nDisallow: /\n\nUser-agent: *\nAllow: /\n'
          assert robots_allows('https://example.com/p', read=lambda u: other, cache={}) is True
          # What a crawler paces itself by, and where it finds the sitemaps.
          from sluicer.fetch.identity import robots_delay, robots_sitemaps
          paced = 'User-agent: Sluicer\nCrawl-delay: 2.5\n\nUser-agent: *\nCrawl-delay: 1\nSitemap: https://example.com/s.xml\n'
          assert robots_delay('https://example.com/p', read=lambda u: paced, cache={}) == 2.5
          assert robots_delay('https://example.com/p', read=lambda u: 'User-agent: *\nRequest-rate: 1/8\n', cache={}) == 8.0
          assert robots_sitemaps('https://example.com/p', read=lambda u: paced, cache={}) == ['https://example.com/s.xml']
          print('robots: the real parser agrees with what the suite believes')

          # The audit reads the same robots.txt for each AI agent, through the
          # real protego, and names the line that decided.
          from sluicer.audit import Site, SiteFile, audit
          rules = 'User-agent: GPTBot\nDisallow: /\n\nUser-agent: ChatGPT\nDisallow: /private/\n\nUser-agent: *\nAllow: /\n'
          site = Site(SiteFile('https://example.com/robots.txt', 200, rules), SiteFile('https://example.com/llms.txt', 404), SiteFile('https://example.com/llms-full.txt', 404))
          verdicts = {v.agent: v for v in audit('<html></html>', url='https://example.com/private/p', site=site).crawlers}
          assert verdicts['GPTBot'].allowed is False and verdicts['GPTBot'].group == 'gptbot', verdicts['GPTBot']
          assert verdicts['ChatGPT-User'].allowed is False and verdicts['ChatGPT-User'].group == 'chatgpt', verdicts['ChatGPT-User']
          assert verdicts['ClaudeBot'].allowed is True and verdicts['ClaudeBot'].group == '*', verdicts['ClaudeBot']
          print('audit: the real parser decides each AI agent as the audit names it')

          from sluicer.fetch.rungs import default_rungs
          names = [name for name, _ in default_rungs()]
          assert names == ['http', 'browser'], names
          print('fetch: two rungs built, plain HTTP and the browser')

          import asyncio
          from sluicer.mcp_server import build_server
          server = build_server()
          tools = sorted(t.name for t in asyncio.run(server.list_tools()))
          assert tools == ['audit_page', 'compile_extractor', 'crawl_site', 'extract_declared', 'fetch_page', 'heal_extractor', 'map_site', 'page_markdown', 'read_feed', 'run_extractor', 'select_values'], tools

          # Registration is not use. The SDK's dispatch is where a future release
          # can break us while every import still resolves, so call a tool for real.
          page = '<html><head><script type=\"application/ld+json\">{\"@type\":\"Product\",\"name\":\"Brake pad set\"}</script></head><body></body></html>'
          answer = asyncio.run(server.call_tool('extract_declared', {'html_or_url': page}))
          text = str(answer)
          assert 'Brake pad set' in text, 'the SDK dispatch lost the record: ' + text[:200]
          assert 'jsonld' in text, 'the provenance did not survive dispatch: ' + text[:200]
          assert '/html/head/script[1]#/name' in text, 'the place did not survive dispatch: ' + text[:300]

          feed = str(asyncio.run(server.call_tool('read_feed', {'url_or_text': '<rss version=\"2.0\"><channel><title>News</title><item><title>First story</title><link>https://example.com/1</link></item></channel></rss>'})))
          assert 'First story' in feed and 'rss' in feed, feed[:300]

          markdown_answer = asyncio.run(server.call_tool('page_markdown', {'html_or_url': '<html><body><article><h1>Title</h1><p>' + ('Real sentences. ' * 30) + '</p></article></body></html>'}))
          assert 'Title' in str(markdown_answer), str(markdown_answer)[:200]

          # The audit's answer is the deepest output schema the server publishes;
          # the SDK validates it on the way out.
          audit_answer = str(asyncio.run(server.call_tool('audit_page', {'html_or_url': page})))
          assert 'Merchant listing' in audit_answer and 'missing_required' in audit_answer, audit_answer[:300]

          # The HTTP door is built from that server, so it is held to the list
          # pinned above rather than to a second one: a tool added there is
          # served here with nothing else to change.
          from starlette.testclient import TestClient
          from sluicer.http_api import build_app
          http = TestClient(build_app(), base_url='http://127.0.0.1')
          served = sorted(t['name'] for t in http.get('/v1/tools').json()['tools'])
          assert served == tools, served
          answer = http.post('/v1/tools/extract_declared', json={'html_or_url': page}).json()
          assert answer['records'][0]['fields']['name']['value'] == 'Brake pad set', answer
          print('http: the same tools, one answered through the same dispatch')
          # The crawl tools' answers are the deepest schemas the server has, and
          # the SDK builds them at registration. Both answer here without a
          # request: a private address is refused before anything is asked.
          for tool in ('map_site', 'crawl_site'):
              refused = asyncio.run(server.call_tool(tool, {'url': 'http://127.0.0.1:9/'}))
              assert 'refused_address' in str(refused), tool + ': ' + str(refused)[:300]
          print('mcp: eleven tools listed, and six of them answered through the SDK dispatch')
          "
      # Building a rung is not using it. Each fetching extra loads pages from
      # a local site here, and the site says what it saw: the browser
      # renders a shell and a second page of the site starts at it, one
      # browser serves the process, the stealth rung renders without a
      # borrowed referer, and sluicer fetch prints the rendered page.
      - name: Call each fetching extra for real
        run: .venv/bin/python tests/live/extras_check.py
      # The unit suite reaches /mcp in process, through httpx2's ASGI transport.
      # This starts sluicer serve and asks it over a real socket what n8n's or
      # Dify's MCP client would, through the mcp package's own client: the tools
      # it lists against stdio's, extract_declared on a fixture page handed in
      # and fetched from a local server, and each refusal of the door.
      - name: MCP over streamable HTTP, against a real sluicer serve
        run: .venv/bin/python tests/live/mcp_http_check.py

  live:
    name: The fetch limits and the crawler hold against real sockets and a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the browser and api extras and a browser
        run: |
          uv venv
          uv pip install '.[browser,api]'
          .venv/bin/python -m playwright install --with-deps chromium
      # The suite fakes the socket and Chromium, and a fake obeys whatever it
      # is told. Two local servers stand in for the web and for a private
      # address, and these ask the real libraries: where does the rung stop
      # reading, does a pinned name go where it was pinned, how many
      # connections do twenty pages cost, and can a page make the browser
      # reach the private one by any route. Without the guard, measured, it
      # reaches it by six.
      - name: The HTTP rung
        run: .venv/bin/python tests/live/http_check.py
      - name: The browser guard
        run: .venv/bin/python tests/live/guard_check.py
      # A caller's headers and cookies reach the site asked and no other,
      # guarded and not; a proxy asked for is the one used; one browser
      # serves every page of the process.
      - name: What the browser sends, and to whom
        run: .venv/bin/python tests/live/browser_check.py
      # The suite reaches the HTTP door through starlette's TestClient, with
      # no socket. This starts sluicer serve three times -- as a user runs it,
      # allowed a local stand-in for the web, and without trafilatura -- and
      # asks it over a real socket: every tool it lists, one error of every
      # kind a request can provoke, each answer against the schema the server
      # publishes for it.
      - name: The HTTP door
        run: .venv/bin/python tests/live/api_check.py
      # The suite paces its crawls by a fake clock, which keeps whatever
      # schedule it is handed. Here a local site writes down when each request
      # arrived and when its answer went out, and every gap is read from that:
      # sitemaps, robots.txt, redirect hops and a slow page included.
      - name: The crawler
        run: .venv/bin/python tests/live/crawl_check.py

  licences:
    name: Every licence in the installed tree has been read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install sluicer with every extra, and nothing else
        run: |
          uv venv
          uv pip install '.[browser,stealth,markdown,mcp,microformats,api]'
      # The README names the non-permissive licences the extras bring in. A new
      # dependency under one nobody has read fails here, not in a user's audit.
      - name: List them, and fail on one nobody has read
        run: .venv/bin/python tests/live/licence_check.py

  floors:
    name: The declared minimum versions actually work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # A dependency floor nobody installs is a wish, not a constraint. Both
      # base floors were wrong when this job was written: lxml 5.0 ships no
      # wheel for cp313 and none at all for macOS arm64, and click 8.1.8 fails
      # fourteen tests because its CliRunner does not capture stderr
      # separately. Both had been declared for months and never executed.
      #
      # Pinned to the minimum Python this project claims: on a newer
      # interpreter the resolver climbs above the floor, because the floor
      # version has no wheel for it, and the job would pass without ever
      # installing what it exists to test.
      #
      # The base is resolved on its own. Installing the extras alongside it
      # lifts lxml and click above their floors, because the extras depend on
      # them too.
      #
      # `.venv/bin/python` throughout, never `uv run`: `uv run` re-syncs the
      # environment from pyproject.toml and reinstalls lxml at its newest,
      # which silently undoes the pin. The assertion below caught exactly that
      # on this job's first run, which is why it is an assertion and not a
      # printed list somebody skims.
      - name: Install the base at its declared floors
        run: |
          uv venv --python 3.10
          uv pip install --resolution lowest-direct .
          # hypothesis for tests/properties, which run here too: the
          # properties are the suite's, and lxml at its floor is a libxml2
          # the default job never parses with.
          uv pip install pytest hypothesis
      - name: Check those really are the floors, not something above them
        run: |
          .venv/bin/python -c "
          import importlib.metadata as md
          for name, floor in {'lxml': '5.3', 'click': '8.2', 'tomli': '1.0.3', 'cssselect': '1.2'}.items():
              got = md.version(name)
              assert got.startswith(floor), (
                  name + ' resolved to ' + got + ', not the declared floor '
                  + floor + ': this job is not testing what it claims to test'
              )
              print(name, got, '-- the declared floor')
          "
      - name: Run the suite against them
        run: .venv/bin/python -m pytest -q
      # protego at its floor, with nothing else installed, through the base's
      # own HTTP rung: what a fetch with the lowest install does.
      - name: And the HTTP rung and the robots parser at the base's floors
        run: |
          .venv/bin/python -c "
          import importlib.metadata as md
          assert md.version('protego').startswith('0.3'), md.version('protego')
          from sluicer.fetch.identity import robots_allows, robots_delay
          rules = 'User-agent: Sluicer\\nDisallow: /private/\\nCrawl-delay: 2\\n'
          assert robots_allows('https://example.com/private/p', read=lambda u: rules, cache={}) is False
          assert robots_delay('https://example.com/p', read=lambda u: rules, cache={}) == 2.0
          print('protego', md.version('protego'), '-- the declared floor, read for real')
          "
          .venv/bin/python tests/live/http_check.py
      - name: And again with every extra at its own lowest version
        run: |
          uv pip install --resolution lowest-direct '.[browser,stealth,markdown,mcp,microformats,api]'
          uv pip list
          # The HTTP door's tests build the real MCP server, so this is where
          # the SDK's floor is used and not only installed: on 3.10, mcp 2.0.x
          # could not build the server at all, and nothing noticed.
          .venv/bin/python -c "
          import importlib.metadata as md
          for name, floor in {'mcp': '2.1.0', 'starlette': '1.2.0', 'uvicorn': '0.31.1'}.items():
              got = md.version(name)
              assert got == floor, (
                  name + ' resolved to ' + got + ', not the declared floor '
                  + floor + ': this job is not testing what it claims to test'
              )
              print(name, got, '-- the declared floor')
          "
          .venv/bin/python -m pytest -q

  latest-extras:
    name: The extras still work at their newest versions
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the extras unpinned and use them
        run: |
          uv venv
          uv pip install '.[browser,stealth,markdown,mcp,api]' --upgrade
          .venv/bin/python -c "
          import asyncio, importlib.metadata as md
          for name in ('playwright', 'scrapling', 'trafilatura', 'mcp', 'starlette', 'uvicorn'):
              print(name, md.version(name))
          from sluicer.mcp_server import build_server
          server = build_server()
          tools = sorted(t.name for t in asyncio.run(server.list_tools()))
          assert tools == ['audit_page', 'compile_extractor', 'crawl_site', 'extract_declared', 'fetch_page', 'heal_extractor', 'map_site', 'page_markdown', 'read_feed', 'run_extractor', 'select_values'], tools
          from starlette.testclient import TestClient
          from sluicer.http_api import build_app
          http = TestClient(build_app(), base_url='http://127.0.0.1')
          assert sorted(t['name'] for t in http.get('/v1/tools').json()['tools']) == tools
          print('still building against the newest published extras')
          "

  docker:
    name: The image builds, runs unprivileged, and reads a page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t sluicer:ci .
      - name: Use it
        # A page handed to it needs no network, so this proves the install in
        # the image without depending on any site being up.
        run: |
          uid=$(docker run --rm sluicer:ci id -u)
          test "$uid" != 0 || { echo "the image runs as root"; exit 1; }
          printf '%s' '<script type="application/ld+json">{"@type":"Product","name":"Pad"}</script>' > page.html
          docker run --rm -v "$PWD/page.html:/tmp/page.html:ro" sluicer:ci \
            sluicer extract /tmp/page.html | tee out.json
          grep -q '"Pad"' out.json
      - name: A client lists its eleven tools over stdio, and the licences are in it
        # The check the release runs before it pushes an image, run on every
        # change, so a release is not the first to find it failing.
        run: |
          python3 packaging/mcp_smoke.py -- docker run -i --rm sluicer:ci
          docker run --rm sluicer:ci sh -c 'cd /usr/share/licenses/sluicer &&
            test -s LICENSE && test -s NOTICE && test -s LICENSES/CC-BY-SA-3.0.txt &&
            test -s LICENSES/Unicode-3.0.txt && grep -q "^lxml " THIRD-PARTY.txt'
      - name: Serve the tools over HTTP from it
        # Published on the runner's loopback only, with a token, as the docs
        # say to run it; and the image refuses to listen beyond loopback
        # without one.
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 -e SLUICER_API_TOKEN=ci-token \
            sluicer:ci sluicer serve --host 0.0.0.0
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/tools)
          test "$code" = 401 || { echo "answered $code without the token"; exit 1; }
          printf '%s' '{"html_or_url": "<script type=\"application/ld+json\">{\"@type\":\"Product\",\"name\":\"Pad\"}</script>"}' > args.json
          curl -fsS -H 'Authorization: Bearer ci-token' -H 'Content-Type: application/json' \
            --data @args.json http://127.0.0.1:8000/v1/tools/extract_declared | tee answer.json
          grep -q '"Pad"' answer.json
          docker rm -f api
          status=0
          docker run --rm sluicer:ci sluicer serve --host 0.0.0.0 || status=$?
          test "$status" = 2 || { echo "without a token it exited $status, not 2"; exit 1; }

  docker-browser:
    # The browser variant is most of a gigabyte and minutes to build, so it is
    # proven weekly rather than on every push -- but proven, because a build
    # argument nobody builds is a claim in a comment.
    name: The image builds with its browser
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image with Chromium
        run: docker build --build-arg WITH_BROWSER=1 -t sluicer:browser .
      # Not Playwright alone: the image's own ladder, as a user runs it, on a
      # page only a browser fills, served inside the container.
      - name: The unprivileged user's ladder climbs to the browser
        run: |
          docker run --rm sluicer:browser python -c "
          import http.server, json, os, subprocess, sys, threading
          page = b'<html><body><div id=r></div><script>document.getElementById(\\'r\\').textContent = \\'rendered \\'.repeat(40)</script></body></html>'
          class Site(http.server.BaseHTTPRequestHandler):
              def log_message(self, *args): pass
              def do_GET(self):
                  body = page if self.path == '/app' else b''
                  self.send_response(200 if body else 404)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), Site)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = 'http://127.0.0.1:%d/app' % server.server_address[1]
          done = subprocess.run(['sluicer', 'fetch', url, '--json'], capture_output=True, text=True)
          assert done.returncode == 0, done.stderr
          answer = json.loads(done.stdout)
          assert answer['rung'] == 'browser' and 'rendered' in answer['html'], answer['rung']
          print('the browser rung renders as', os.getuid())
          "
