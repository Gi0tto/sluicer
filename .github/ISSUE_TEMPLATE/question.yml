name: Something unclear
description: A question about installing or using Sluicer, or documentation that did not answer it
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you expected to find.
    validations:
      required: true
  - type: textarea
    id: looked
    attributes:
      label: Where you looked
      description: The page of the documentation or the README you read first. A question that the documentation should have answered is a bug in the documentation.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "`sluicer --version` and your Python version, if the question is about behaviour."
      render: text
