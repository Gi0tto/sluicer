site_name: Sluicer
site_description: Turn a web page into structured data. No model, no API key, no bill.
site_url: https://gi0tto.github.io/sluicer/
repo_url: https://github.com/Gi0tto/sluicer
repo_name: Gi0tto/sluicer
edit_uri: edit/main/docs/
# The theme's additions live beside the pages but are not pages.
exclude_docs: /overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark-512.png
  favicon: assets/mark-512.png
  features:
    - content.code.copy
    - content.action.edit
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Extractors: extractors.md
      - In your agent: agents.md
      - HTTP API: http-api.md
      - In JavaScript: javascript.md
      - Crawling: crawling.md
      - Configuration: configuration.md
      - Web archives: warc.md
      - Audit: audit.md
      - In GitHub Actions: github-action.md
      - Moving from extruct: extruct.md
  - Reference:
      - Command line: reference/cli.md
      - MCP tools: reference/mcp.md
      - Python: reference/python.md
  - Measured:
      - Scoreboard: scoreboard.md
      - As served: scoreboard-served.md
      - Products: scoreboard-products.md
      - News in many languages: scoreboard-news.md
      - trafilatura's evaluation set: scoreboard-evaldata.md
      - Extractors on SWDE: scoreboard-swde.md
      - Drift: drift.md
      - The field, measured: field-survey.md
  - Project:
      - Why Sluicer: why.md
      - FAQ: faq.md
      - Known limits: known-limits.md
      - What is stable: stability.md
      - Design notes: design-notes.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Security: security.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - smarty
  - toc: { permalink: true }

# The examples' made-up site, published at demo/ for trying Sluicer on, and
# the wheel, bridge and example the try page runs, published at try/.
hooks:
  - scripts/docs_demo.py
  - scripts/docs_try.py
  - scripts/docs_llms.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gi0tto/sluicer
      name: Sluicer on GitHub
    - icon: material/forum-outline
      link: https://github.com/Gi0tto/sluicer/discussions
      name: Questions and ideas, in Discussions
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/sluicer/
      name: Sluicer on PyPI
    - icon: octicons/heart-16
      link: https://github.com/sponsors/Gi0tto
      name: Sponsor Sluicer
