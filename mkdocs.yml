site_name: Sluicer
site_description: Turn a web page into structured data. No model, no API key, no bill.
site_url: https://gi0tto.github.io/sluicer/
repo_url: https://github.com/Gi0tto/sluicer
repo_name: Gi0tto/sluicer
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark-512.png
  favicon: assets/mark-512.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light }

nav:
  - Sluicer: index.md
  - Why Sluicer: why.md
  - Extractors: extractors.md
  - HTTP API: http-api.md
  - Audit: audit.md
  - Known limits: known-limits.md
  - Design notes: design-notes.md
  - Scoreboard: scoreboard.md
  - Scoreboard, as served: scoreboard-served.md
  - Scoreboard, products: scoreboard-products.md
  - Drift: drift.md
  - The field, measured: field-survey.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc: { permalink: true }
